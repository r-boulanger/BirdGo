<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tree House Signs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Libre+Franklin:wght@400;500;600;700&family=Cinzel:wght@700&display=swap">
<style>
body{margin:0;background:#E4E8D9;color:#25332C;font-family:"Libre Franklin",system-ui,sans-serif;padding:20px}
h1{font-family:Caveat,cursive;font-size:44px;margin:0 0 4px}
p{margin:0 0 14px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:1000px}
.opt{background:#EEF1E6;border:1.5px solid #25332C;padding:10px}
.lbl{font-family:Caveat,cursive;font-size:26px;font-weight:700;line-height:1;margin-bottom:6px}
.crop{width:100%;aspect-ratio:360/150;overflow:hidden;border:1.5px solid #25332C;position:relative;background:#DDE6D6}
.crop svg{position:absolute;left:0;top:-4%;width:100%;height:auto}
</style>
</head>
<body>
<h1>Tree house name sign</h1>
<p>Six styles for the sign on the roof. "Birdhouse Inn" is a stand-in name.</p>
<div class="grid" id="g"></div>
<script type="module">
import { treehouseHTML, SIGN_STYLES, SIGN_LABEL } from "../../src/treehouse-art.js";
const g = document.getElementById("g");
Object.keys(SIGN_STYLES).forEach((k, i) => {
  const d = document.createElement("div"); d.className = "opt";
  const svg = treehouseHTML(Array(6).fill(null), { sign: k }).split("<button")[0];
  d.innerHTML = `<div class="lbl">${i + 1} · ${SIGN_LABEL[k]}</div><div class="crop">${svg}</div>`;
  g.appendChild(d);
});
</script>
</body>
</html>
